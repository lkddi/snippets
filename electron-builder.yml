appId: com.pllx.snippets
productName: 灵犀
directories:
  buildResources: build
# macOS ad-hoc 签名钩子：见 scripts/adhoc-sign.cjs 头部注释
afterPack: scripts/adhoc-sign.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # 原生模块必须解包到真实文件系统，asar 内无法 dlopen
  - '**/*.node'
win:
  executableName: snippets
nsis:
  artifactName: lingxi-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  # 不配 identity：CI 无证书时 electron-builder 自动 ad-hoc 签名。
  # 不能配 null（完全跳过签名）：未签名的包从浏览器下载后带隔离属性，
  # macOS 13+ 会直接报「已损坏，无法打开」；ad-hoc 签名只降级为
  # 「无法验证开发者」，右键打开即可
  # CSC_IDENTITY_AUTO_DISCOVERY=false 同理：跳过钥匙串搜索、直接 ad-hoc
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Documents folder.
  notarize: false
dmg:
  artifactName: lingxi-${version}-arm64.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
